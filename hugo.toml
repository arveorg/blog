baseURL = 'https://arve.org/'
languageCode = 'en-us'
title = 'arve.org'
theme = "shibui"
timeZone = "Asia/Dubai"
enableGitInfo = true

[params]
description = "Over three decades I've shaped what didn't yet exist, turning thought into form and quiet inventions. With agentic coding as my second nature, I am now unstoppable."

[params.author]
name = "arve"
email = "github@arve.org"

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    noClasses = true
    tabWidth = 4
    style = "algol_nu"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = true

[menu]
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 1

[build]
  writeStats = true

[frontmatter]
  date = ['date', 'publishDate', 'lastmod']
  expiryDate = ['expiryDate']
  lastmod = [':git', 'lastmod', 'date', 'publishDate']
  publishDate = ['publishDate', 'date']
